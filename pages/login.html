<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 — GenAI 학습동아리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Fraunces:ital,wght@0,300;0,700;1,300;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--bg2:#0e1520;--bg3:#141d2b;--bg4:#1a2538;--mint:#00e5c3;--mint2:#00b89e;--mint-dim:rgba(0,229,195,.12);--blue:#4a9eff;--text:#e2e8f0;--text2:#94a3b8;--text3:#4a5568;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--danger:#ff5c5c;--warn:#ffb647;--success:#00e5a0;--r:12px;--r2:8px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.7;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none}

/* ── LAYOUT ── */
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.25rem;}
.auth-card{width:100%;max-width:400px;}

/* ── LOGO ── */
.auth-logo{text-align:center;margin-bottom:2rem;}
.auth-logo a{font-family:'Fraunces',serif;font-style:italic;font-size:1.5rem;color:var(--mint);}
.auth-logo p{font-size:.82rem;color:var(--text2);margin-top:.35rem;}

/* ── CARD BOX ── */
.auth-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:2.25rem 2rem;}
.auth-box h1{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;margin-bottom:1.75rem;color:var(--text);}

/* ── FORM ── */
.field{margin-bottom:1rem;}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.field input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r2);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:.92rem;padding:11px 14px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(0,229,195,.1);}
.field input::placeholder{color:var(--text3)}
.field input.err{border-color:var(--danger);}
.field-err{font-size:.75rem;color:var(--danger);margin-top:5px;display:none;}
.field-err.show{display:block}

/* ── PW TOGGLE ── */
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;padding:2px;line-height:1;transition:color .2s;}
.pw-toggle:hover{color:var(--text2)}

/* ── REMEMBER ── */
.remember-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;}
.check-label{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.82rem;color:var(--text2);}
.check-label input[type=checkbox]{width:15px;height:15px;accent-color:var(--mint);cursor:pointer;}
.forget-link{font-size:.78rem;color:var(--text2);transition:color .2s;}
.forget-link:hover{color:var(--mint)}

/* ── BUTTONS ── */
.btn-login{width:100%;padding:13px;background:var(--mint);color:#080c14;font-family:'Noto Sans KR',sans-serif;font-size:.95rem;font-weight:700;border:none;border-radius:var(--r2);cursor:pointer;transition:background .2s,transform .15s;letter-spacing:.02em;}
.btn-login:hover{background:var(--mint2);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{background:var(--bg4);color:var(--text3);cursor:not-allowed;transform:none;}

/* ── DIVIDER ── */
.divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0;color:var(--text3);font-size:.78rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── REGISTER LINK ── */
.to-register{text-align:center;font-size:.85rem;color:var(--text2);}
.to-register a{color:var(--mint);font-weight:600;margin-left:4px;}
.to-register a:hover{text-decoration:underline}

/* ── MOCK NOTICE ── */
.mock-notice{background:rgba(255,182,71,.07);border:1px solid rgba(255,182,71,.2);border-radius:var(--r2);padding:.75rem 1rem;font-size:.78rem;color:var(--warn);margin-bottom:1.25rem;line-height:1.6;}
.mock-notice strong{display:block;margin-bottom:2px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:10px 22px;border-radius:20px;font-size:.85rem;opacity:0;transition:all .3s;z-index:800;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.s{border-color:rgba(0,229,195,.4);color:var(--success)}
#toast.e{border-color:rgba(255,92,92,.4);color:var(--danger)}

/* ── FOOTER ── */
.auth-footer{text-align:center;padding:1.5rem;font-size:.75rem;color:var(--text3);}
.auth-footer a{color:var(--text2);margin:0 .5rem;}
.auth-footer a:hover{color:var(--mint)}

@media(max-width:480px){.auth-box{padding:1.75rem 1.25rem}}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <a href="../index.html">✦ GenAI 동아리</a>
      <p>생성형 AI 학습동아리 포털</p>
    </div>

    <div class="auth-box">
      <h1>로그인</h1>

      <div class="mock-notice" id="mock-notice" style="display:none">
        <strong>⚠ 데모 모드</strong>
        Apps Script가 연결되지 않아 로컬 저장 데이터로 작동합니다.<br>
        회원가입 후 동일 이메일·비밀번호로 로그인하세요.
      </div>

      <form id="login-form">
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="example@email.com" autocomplete="username" required>
          <div class="field-err" id="email-err"></div>
        </div>

        <div class="field">
          <label for="pw">비밀번호</label>
          <div class="pw-wrap">
            <input type="password" id="pw" placeholder="비밀번호 입력" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pw-toggle-btn" title="비밀번호 표시">👁</button>
          </div>
          <div class="field-err" id="pw-err"></div>
        </div>

        <div class="remember-row">
          <label class="check-label">
            <input type="checkbox" id="remember"> 로그인 상태 유지
          </label>
          <a href="#" class="forget-link" id="forgot-link">비밀번호 찾기</a>
        </div>

        <button type="submit" class="btn-login" id="login-btn">로그인</button>
      </form>

      <div class="divider">또는</div>

      <div class="to-register">
        아직 회원이 아니신가요?<a href="register.html">회원가입</a>
      </div>
    </div>

  </div>
</div>

<div class="auth-footer">
  <a href="../index.html">홈</a>
  <a href="intro.html">동아리 소개</a>
  <a href="register.html">회원가입</a>
</div>

<div id="toast"></div>

<script src="../common.js"></script>
<script>
const API_URL = (typeof CFG !== 'undefined') ? CFG.API_URL : 'YOUR_APPS_SCRIPT_URL_HERE';
const IS_MOCK = API_URL === 'YOUR_APPS_SCRIPT_URL_HERE';

document.addEventListener('DOMContentLoaded', () => {
  if (IS_MOCK) document.getElementById('mock-notice').style.display = 'block';

  // 이미 로그인 상태면 홈으로
  const sess = loadSession();
  if (sess) { window.location.href = '../index.html'; return; }

  // remember me 복원
  const saved = localStorage.getItem('gai_saved_email');
  if (saved) { document.getElementById('email').value = saved; document.getElementById('remember').checked = true; }

  // 이벤트 리스너
  document.getElementById('login-form').addEventListener('submit', doLogin);
  document.getElementById('pw-toggle-btn').addEventListener('click', function() { togglePw('pw', this); });
  document.getElementById('forgot-link').addEventListener('click', forgotPw);
});

function loadSession() {
  try { return JSON.parse(sessionStorage.getItem('gai_user') || localStorage.getItem('gai_user') || 'null'); }
  catch { return null; }
}

function saveSession(user, remember) {
  const json = JSON.stringify(user);
  sessionStorage.setItem('gai_user', json);
  if (remember) localStorage.setItem('gai_user', json);
}

function togglePw(id, btn) {
  const el = document.getElementById(id);
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
  document.getElementById(id.replace('-err','')).classList.add('err');
}
function clearErrs() {
  document.querySelectorAll('.field-err').forEach(e => { e.classList.remove('show'); e.textContent=''; });
  document.querySelectorAll('.field input').forEach(e => e.classList.remove('err'));
}

async function doLogin(e) {
  e.preventDefault();
  clearErrs();
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  const remember = document.getElementById('remember').checked;
  const btn = document.getElementById('login-btn');

  if (!email) { showErr('email-err', '이메일을 입력해 주세요.'); return; }
  if (!pw) { showErr('pw-err', '비밀번호를 입력해 주세요.'); return; }

  btn.disabled = true; btn.textContent = '로그인 중...';

  try {
    if (IS_MOCK) {
      await mockDelay(600);
      const users = JSON.parse(localStorage.getItem('gai_members') || '[]');
      const user = users.find(u => u.email === email && u.password === pw);
      if (!user) {
        showErr('pw-err', '이메일 또는 비밀번호가 올바르지 않습니다.');
        btn.disabled = false; btn.textContent = '로그인';
        return;
      }
      if (remember) localStorage.setItem('gai_saved_email', email);
      else localStorage.removeItem('gai_saved_email');
      saveSession({ name: user.name, email: user.email, dept: user.dept, role: user.role || 'member' }, remember);
      toast('환영합니다, ' + user.name + '님! 🎉', 's');
      setTimeout(() => window.location.href = '../index.html', 1000);
    } else {
      const res = await fetch(`${API_URL}?${new URLSearchParams({ action: 'login', email, password: pw })}`);
      const data = await res.json();
      if (data.success) {
        if (remember) localStorage.setItem('gai_saved_email', email);
        saveSession(data.user, remember);
        toast('환영합니다, ' + data.user.name + '님! 🎉', 's');
        setTimeout(() => window.location.href = '../index.html', 1000);
      } else {
        showErr('pw-err', data.error || '이메일 또는 비밀번호가 올바르지 않습니다.');
        btn.disabled = false; btn.textContent = '로그인';
      }
    }
  } catch {
    showErr('pw-err', '서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    btn.disabled = false; btn.textContent = '로그인';
  }
}

function forgotPw(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) { showErr('email-err', '먼저 이메일을 입력해 주세요.'); return; }
  toast('관리자(지현석 리더)에게 비밀번호 초기화를 요청해 주세요.', '');
}

function mockDelay(ms) { return new Promise(r => setTimeout(r, ms)); }

// _tt, toast 는 common.js 에서 제공
</script>
</body>
</html>
