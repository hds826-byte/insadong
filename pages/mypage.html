<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마이페이지 — GenAI 동아리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Fraunces:ital,wght@0,300;0,700;1,300;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--bg2:#0e1520;--bg3:#141d2b;--bg4:#1a2538;--mint:#00e5c3;--mint2:#00b89e;--mint-dim:rgba(0,229,195,.12);--blue:#4a9eff;--text:#e2e8f0;--text2:#94a3b8;--text3:#4a5568;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--danger:#ff5c5c;--warn:#ffb647;--r:12px;--r2:8px;--nav-h:62px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.7;overflow-x:hidden;}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--nav-h);display:flex;align-items:center;padding:0 clamp(1rem,4vw,2rem);gap:.75rem;background:rgba(8,12,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Fraunces',serif;font-style:italic;font-size:1.1rem;color:var(--mint);margin-right:auto;}
.nav-links{display:flex;gap:2px;flex-wrap:nowrap;}
.nav-links a{color:var(--text2);font-size:.78rem;padding:5px 10px;border-radius:20px;transition:color .2s,background .2s;white-space:nowrap;}
.nav-links a:hover{color:var(--text);background:var(--bg4)}
.nav-links a.active{color:var(--mint);background:var(--mint-dim)}
.nav-auth{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
.nav-user{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--text2);}
.nav-user .av{width:28px;height:28px;border-radius:50%;background:var(--mint-dim);border:1px solid rgba(0,229,195,.25);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--mint);}
.nav-user .name{color:var(--text);font-weight:500;}
.nav-user .name:hover{color:var(--mint)}
.nav-user .logout{color:var(--text3);cursor:pointer;font-size:.72rem;padding:4px 8px;border-radius:10px;transition:color .2s;}
.nav-user .logout:hover{color:var(--danger)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;border:none;background:transparent;}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--text2);border-radius:2px;transition:all .3s;}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-drawer{position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;z-index:499;background:rgba(8,12,20,.98);backdrop-filter:blur(20px);padding:2rem 1.5rem;display:flex;flex-direction:column;gap:.5rem;transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);overflow-y:auto;}
.mobile-drawer.open{transform:translateX(0)}
.mobile-drawer a{color:var(--text2);font-size:1.1rem;font-weight:500;padding:1rem;border-radius:var(--r2);border:1px solid var(--border);transition:all .2s;display:block;}
.mobile-drawer a:hover{color:var(--mint);border-color:var(--mint-dim);background:var(--mint-dim)}
.page{padding-top:var(--nav-h);}
.page-hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border);padding:3.5rem clamp(1.25rem,4vw,2.5rem) 2.5rem;text-align:center;}
.page-hero .label{display:inline-block;background:var(--mint-dim);color:var(--mint);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:1rem;}
.page-hero h1{font-family:'Fraunces',serif;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1;letter-spacing:-.02em;margin-bottom:.6rem;}
.page-hero p{color:var(--text2);font-size:.9rem;max-width:480px;margin:0 auto;}
.container{max-width:760px;margin:0 auto;padding:2.5rem clamp(1.25rem,4vw,2.5rem);}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text2);margin-bottom:1.75rem;flex-wrap:wrap;}
.breadcrumb a:hover{color:var(--mint)}
.breadcrumb .sep{color:var(--text3);}
/* 프로필 카드 */
.profile-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:2rem;display:flex;gap:1.5rem;align-items:flex-start;margin-bottom:1.5rem;}
.profile-av{width:72px;height:72px;border-radius:50%;background:var(--mint-dim);border:2px solid rgba(0,229,195,.3);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:var(--mint);flex-shrink:0;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;margin-bottom:.3rem;}
.profile-meta{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem;}
.profile-meta span{font-size:.82rem;color:var(--text2);}
.role-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:600;}
.role-leader{background:rgba(0,229,195,.15);color:var(--mint)}
.role-manager{background:rgba(74,158,255,.15);color:var(--blue)}
.role-member{background:var(--bg3);color:var(--text2)}
.profile-actions{display:flex;gap:.75rem;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--r2);font-size:.85rem;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid transparent;font-family:'Noto Sans KR',sans-serif;}
.btn-primary{background:var(--mint);color:#080c14;border-color:var(--mint);}
.btn-primary:hover{background:var(--mint2)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border2);}
.btn-ghost:hover{background:var(--bg4)}
.btn-danger{background:transparent;color:var(--danger);border-color:rgba(255,92,92,.3);}
.btn-danger:hover{background:rgba(255,92,92,.1)}
/* 정보 섹션 */
.sec-title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;}
.info-table{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1.5rem;}
.info-row{display:flex;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none}
.info-key{width:110px;flex-shrink:0;background:var(--bg3);padding:.75rem 1rem;font-size:.78rem;font-weight:600;color:var(--text2);letter-spacing:.04em;}
.info-val{padding:.75rem 1rem;font-size:.88rem;color:var(--text);flex:1;}
/* 빠른 메뉴 */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin-bottom:1.5rem;}
.quick-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;transition:all .2s;display:flex;flex-direction:column;gap:.4rem;}
.quick-card:hover{border-color:var(--mint);background:var(--bg3);transform:translateY(-2px);}
.qc-icon{font-size:1.4rem;}
.qc-title{font-weight:700;font-size:.88rem;}
.qc-desc{font-size:.75rem;color:var(--text2);line-height:1.5;}
/* 비로그인 안내 */
.login-gate{text-align:center;padding:5rem 1rem;}
.login-gate-icon{font-size:3rem;margin-bottom:1rem;opacity:.5;}
.login-gate h2{font-family:'Fraunces',serif;font-size:1.5rem;margin-bottom:.5rem;}
.login-gate p{color:var(--text2);font-size:.9rem;margin-bottom:1.5rem;}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:10px 22px;border-radius:20px;font-size:.85rem;opacity:0;transition:all .3s;z-index:800;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.s{border-color:rgba(0,229,195,.4);color:#00e5a0}
#toast.e{border-color:rgba(255,92,92,.4);color:#ff5c5c}
.site-footer{border-top:1px solid var(--border);padding:2rem;text-align:center;color:var(--text3);font-size:.78rem;margin-top:2rem;}
.site-footer a{color:var(--text2);}
.site-footer a:hover{color:var(--mint)}
@media(max-width:900px){.nav-links{display:none}.nav-auth{display:none}.nav-hamburger{display:flex}}
@media(max-width:540px){.profile-card{flex-direction:column;align-items:center;text-align:center}.profile-meta{justify-content:center}.profile-actions{justify-content:center}}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="../index.html">✦ GenAI 동아리</a>
  <div class="nav-links">
    <a href="intro.html">소개</a>
    <a href="vote.html">대면일 투표</a>
    <a href="news.html">AI 뉴스</a>
    <a href="contest.html">공모전</a>
    <a href="../index.html#opinions">의견나눔</a>
  </div>
  <div class="nav-auth" id="nav-auth">
    <a href="login.html" class="nav-login" style="color:var(--text2);font-size:.78rem;padding:6px 12px;border-radius:20px;border:1px solid var(--border2);">로그인</a>
  </div>
  <button class="nav-hamburger" id="hbg" onclick="toggleD()" aria-label="메뉴"><span></span><span></span><span></span></button>
</nav>

<div class="mobile-drawer" id="mdr">
  <a href="intro.html" onclick="closeD()">📌 동아리 소개</a>
  <a href="vote.html" onclick="closeD()">📅 대면일 투표</a>
  <a href="news.html" onclick="closeD()">📰 AI 뉴스</a>
  <a href="contest.html" onclick="closeD()">🏅 공모전</a>
  <a href="../index.html#opinions" onclick="closeD()">💬 의견나눔</a>
</div>

<div class="page">
  <div class="page-hero">
    <div class="label">👤 마이페이지</div>
    <h1 id="hero-title">안녕하세요!</h1>
    <p id="hero-sub">GenAI 학습동아리 멤버 전용 페이지입니다.</p>
  </div>

  <div class="container" id="main-content">
    <!-- JS로 채워짐 -->
  </div>
</div>

<footer class="site-footer">
  <a href="../index.html">홈</a> &nbsp;·&nbsp; <a href="intro.html">소개</a> &nbsp;·&nbsp; <a href="news.html">AI 뉴스</a> &nbsp;·&nbsp; <a href="contest.html">공모전</a>
</footer>

<div id="toast"></div>
<script src="../common.js"></script>
<script>
function getSession(){try{return JSON.parse(sessionStorage.getItem('gai_user')||localStorage.getItem('gai_user')||'null');}catch{return null;}}

function logout(){
  if(!confirm('로그아웃 하시겠습니까?'))return;
  sessionStorage.removeItem('gai_user');localStorage.removeItem('gai_user');
  toast('로그아웃 됐습니다.','s');
  setTimeout(()=>location.href='../index.html',800);
}

function roleLabel(r){
  if(r==='leader')return'<span class="role-badge role-leader">리더</span>';
  if(r==='manager')return'<span class="role-badge role-manager">운영진</span>';
  return'<span class="role-badge role-member">멤버</span>';
}

function toggleD(){
  const h=document.getElementById('hbg'),d=document.getElementById('mdr');
  h.classList.toggle('open');d.classList.toggle('open');
  document.body.style.overflow=d.classList.contains('open')?'hidden':'';
}
function closeD(){
  document.getElementById('hbg').classList.remove('open');
  document.getElementById('mdr').classList.remove('open');
  document.body.style.overflow='';
}

document.addEventListener('DOMContentLoaded',()=>{
  const user=getSession();
  const main=document.getElementById('main-content');

  if(!user){
    document.getElementById('hero-title').textContent='로그인이 필요합니다';
    document.getElementById('hero-sub').textContent='마이페이지는 로그인 후 이용 가능합니다.';
    main.innerHTML=`
      <div class="login-gate">
        <div class="login-gate-icon">🔒</div>
        <h2>로그인이 필요합니다</h2>
        <p>마이페이지는 동아리 회원만 이용할 수 있습니다.<br>회원가입 후 로그인해 주세요.</p>
        <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;">
          <a href="login.html" class="btn btn-primary">로그인하기</a>
          <a href="register.html" class="btn btn-ghost">회원가입</a>
        </div>
      </div>`;
    return;
  }

  // 네비게이션 업데이트
  const av=(user.name||'?').slice(0,2);
  document.getElementById('nav-auth').innerHTML=`<div class="nav-user"><div class="av">${av}</div><a href="mypage.html" class="name" style="color:var(--text);font-weight:500;">${esc(user.name)}</a><span class="logout" onclick="logout()">로그아웃</span></div>`;

  document.getElementById('hero-title').textContent=`안녕하세요, ${user.name}님!`;
  document.getElementById('hero-sub').textContent='GenAI 학습동아리 멤버 페이지입니다.';

  const joinDate=localStorage.getItem('gai_join_date')||'2026년';

  main.innerHTML=`
    <div class="breadcrumb">
      <a href="../index.html">홈</a><span class="sep">›</span><span>마이페이지</span>
    </div>

    <div class="profile-card">
      <div class="profile-av">${av}</div>
      <div class="profile-info">
        <div class="profile-name">${esc(user.name)}</div>
        <div class="profile-meta">
          ${user.dept?`<span>🏢 ${esc(user.dept)}</span>`:''}
          ${user.email?`<span>✉ ${esc(user.email)}</span>`:''}
          ${roleLabel(user.role||'member')}
        </div>
        <div class="profile-actions">
          <button class="btn btn-danger" onclick="logout()">로그아웃</button>
          <a href="../index.html#vote" class="btn btn-ghost">📅 투표하러 가기</a>
        </div>
      </div>
    </div>

    <div style="margin-bottom:1.5rem">
      <div class="sec-title">📋 계정 정보</div>
      <div class="info-table">
        <div class="info-row"><div class="info-key">이름</div><div class="info-val">${esc(user.name)}</div></div>
        ${user.email?`<div class="info-row"><div class="info-key">이메일</div><div class="info-val">${esc(user.email)}</div></div>`:''}
        ${user.dept?`<div class="info-row"><div class="info-key">부서</div><div class="info-val">${esc(user.dept)}</div></div>`:''}
        <div class="info-row"><div class="info-key">역할</div><div class="info-val">${user.role==='leader'?'리더':user.role==='manager'?'운영진':'멤버'}</div></div>
        <div class="info-row"><div class="info-key">비밀번호</div><div class="info-val" style="color:var(--text2);font-size:.82rem;">변경은 관리자(지현석 리더)에게 문의해 주세요.</div></div>
      </div>
    </div>

    <div style="margin-bottom:1.5rem">
      <div class="sec-title">🔗 빠른 메뉴</div>
      <div class="quick-grid">
        <a href="vote.html" class="quick-card"><div class="qc-icon">📅</div><div class="qc-title">대면일 투표</div><div class="qc-desc">다음 모임 날짜 투표하기</div></a>
        <a href="news.html" class="quick-card"><div class="qc-icon">📰</div><div class="qc-title">AI 뉴스</div><div class="qc-desc">오늘의 AI 소식</div></a>
        <a href="contest.html" class="quick-card"><div class="qc-icon">🏅</div><div class="qc-title">AI 공모전</div><div class="qc-desc">공공기관 공모전 정보</div></a>
        <a href="../index.html#opinions" class="quick-card"><div class="qc-icon">💬</div><div class="qc-title">의견나눔</div><div class="qc-desc">자유롭게 이야기해요</div></a>
        <a href="intro.html" class="quick-card"><div class="qc-icon">📌</div><div class="qc-title">동아리 소개</div><div class="qc-desc">멤버·비전·일정 보기</div></a>
        <a href="register.html" class="quick-card" style="opacity:.5;pointer-events:none;"><div class="qc-icon">⚙</div><div class="qc-title">설정</div><div class="qc-desc">준비 중</div></a>
      </div>
    </div>`;
});
</script>
</body>
</html>
