<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 공모전 — GenAI 동아리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Fraunces:ital,wght@0,300;0,700;1,300;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--bg2:#0e1520;--bg3:#141d2b;--bg4:#1a2538;--mint:#00e5c3;--mint2:#00b89e;--mint-dim:rgba(0,229,195,.12);--blue:#4a9eff;--text:#e2e8f0;--text2:#94a3b8;--text3:#4a5568;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--danger:#ff5c5c;--warn:#ffb647;--r:12px;--r2:8px;--nav-h:62px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.7;overflow-x:hidden;}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--nav-h);display:flex;align-items:center;padding:0 clamp(1rem,4vw,2rem);gap:.75rem;background:rgba(8,12,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Fraunces',serif;font-style:italic;font-size:1.1rem;color:var(--mint);margin-right:auto;}
.nav-links{display:flex;gap:2px;flex-wrap:nowrap;}
.nav-links a{color:var(--text2);font-size:.78rem;padding:5px 10px;border-radius:20px;transition:color .2s,background .2s;white-space:nowrap;}
.nav-links a:hover{color:var(--text);background:var(--bg4)}
.nav-links a.active{color:var(--mint);background:var(--mint-dim)}
.nav-auth{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
.nav-login{color:var(--text2);font-size:.78rem;padding:6px 12px;border-radius:20px;border:1px solid var(--border2);transition:all .2s;white-space:nowrap;}
.nav-login:hover{color:var(--mint);border-color:rgba(0,229,195,.3)}
.nav-join{background:var(--mint);color:#080c14;font-size:.78rem;font-weight:700;padding:6px 16px;border-radius:20px;white-space:nowrap;transition:background .2s;}
.nav-join:hover{background:var(--mint2)}
.nav-user{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--text2);}
.nav-user .av{width:28px;height:28px;border-radius:50%;background:var(--mint-dim);border:1px solid rgba(0,229,195,.25);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--mint);}
.nav-user .name{color:var(--text);font-weight:500;}
.nav-user .mypage-btn{color:var(--mint);font-size:.72rem;padding:4px 10px;border-radius:10px;border:1px solid rgba(0,229,195,.3);transition:all .2s;white-space:nowrap;}
.nav-user .mypage-btn:hover{background:var(--mint-dim)}
.nav-user .name:hover{color:var(--mint)}
.nav-user .logout{color:var(--text3);cursor:pointer;font-size:.72rem;padding:4px 8px;border-radius:10px;transition:color .2s;}
.nav-user .logout:hover{color:var(--danger)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;border:none;background:transparent;}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--text2);border-radius:2px;transition:all .3s;}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-drawer{position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;z-index:499;background:rgba(8,12,20,.98);backdrop-filter:blur(20px);padding:2rem 1.5rem;display:flex;flex-direction:column;gap:.5rem;transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);overflow-y:auto;}
.mobile-drawer.open{transform:translateX(0)}
.mobile-drawer a{color:var(--text2);font-size:1.1rem;font-weight:500;padding:1rem;border-radius:var(--r2);border:1px solid var(--border);transition:all .2s;display:block;}
.mobile-drawer a:hover{color:var(--mint);border-color:var(--mint-dim);background:var(--mint-dim)}
.mobile-drawer .m-join{background:var(--mint);color:#080c14;font-weight:700;border-color:var(--mint);margin-top:.5rem;text-align:center;}
.page{padding-top:var(--nav-h);}
.page-hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border);padding:3.5rem clamp(1.25rem,4vw,2.5rem) 2.5rem;text-align:center;}
.page-hero .label{display:inline-block;background:var(--mint-dim);color:var(--mint);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:1rem;}
.page-hero h1{font-family:'Fraunces',serif;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1;letter-spacing:-.02em;margin-bottom:.6rem;}
.page-hero p{color:var(--text2);font-size:.9rem;max-width:480px;margin:0 auto;}
.container{max-width:960px;margin:0 auto;padding:2.5rem clamp(1.25rem,4vw,2.5rem);}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text2);margin-bottom:1.75rem;flex-wrap:wrap;}
.breadcrumb a:hover{color:var(--mint)}
.breadcrumb .sep{color:var(--text3);}
/* 통계 카드 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:2rem;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1rem;text-align:center;}
.stat-num{font-family:'Fraunces',serif;font-size:2rem;line-height:1.1;color:var(--text);margin-bottom:.2rem;}
.stat-num.urgent{color:var(--danger)}
.stat-label{font-size:.72rem;color:var(--text2);}
/* 필터 */
.filter-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.filter-tab{padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:500;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.filter-tab:hover{border-color:var(--border2);color:var(--text)}
.filter-tab.active{background:var(--mint-dim);border-color:rgba(0,229,195,.3);color:var(--mint)}
/* 공모전 그리드 */
.contest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;}
.contest-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;display:flex;flex-direction:column;gap:.5rem;transition:all .2s;}
.contest-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.contest-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;}
.cc-cat{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--mint-dim);color:var(--mint);}
.cc-dday{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;}
.cc-dday.d-urgent{background:rgba(255,92,92,.15);color:var(--danger)}
.cc-dday.d-soon{background:rgba(255,182,71,.12);color:var(--warn)}
.cc-dday.d-ok{background:var(--bg4);color:var(--text2)}
.cc-dday.d-closed{background:var(--bg4);color:var(--text3)}
.cc-title{font-weight:700;font-size:.95rem;color:var(--text);line-height:1.4;}
.cc-org{font-size:.8rem;color:var(--text2);}
.cc-desc{font-size:.82rem;color:var(--text2);line-height:1.65;flex:1;}
.cc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;flex-wrap:wrap;gap:.3rem;}
.cc-deadline{font-size:.78rem;font-weight:600;}
.cc-deadline.urgent{color:var(--danger)}
.cc-deadline.soon{color:var(--warn)}
.cc-deadline.ok{color:var(--text2)}
.cc-deadline.closed{color:var(--text3)}
.cc-prize{font-size:.78rem;color:var(--text2);}
.cc-link{font-size:.78rem;color:var(--mint);font-weight:600;margin-top:.25rem;display:inline-block;}
.cc-link:hover{text-decoration:underline}
/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem;}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:2rem;width:100%;max-width:500px;}
.modal h3{font-family:'Fraunces',serif;font-size:1.3rem;margin-bottom:.4rem;}
.modal p{color:var(--text2);font-size:.85rem;margin-bottom:1.25rem;}
.form-row{display:flex;gap:.75rem;margin-bottom:.75rem;}
.form-row>*{flex:1}
.form-group{margin-bottom:.75rem;}
.form-label{font-size:.75rem;color:var(--text2);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block;}
input,textarea,select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:.88rem;padding:9px 13px;outline:none;transition:border-color .2s;}
input:focus,textarea:focus,select:focus{border-color:rgba(0,229,195,.4)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{resize:vertical}
.modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:var(--r2);font-size:.88rem;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid transparent;font-family:'Noto Sans KR',sans-serif;}
.btn-primary{background:var(--mint);color:#080c14;border-color:var(--mint);}
.btn-primary:hover{background:var(--mint2)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border2);}
.btn-ghost:hover{background:var(--bg4)}
.btn-sm{padding:6px 14px;font-size:.8rem}
/* 로딩·빈 */
.spin-wrap{display:flex;align-items:center;justify-content:center;gap:8px;padding:3rem;color:var(--text2);font-size:.88rem;}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--mint);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2);grid-column:1/-1;}
.empty-icon{font-size:2rem;margin-bottom:.75rem;opacity:.4;}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:10px 22px;border-radius:20px;font-size:.85rem;opacity:0;transition:all .3s;z-index:800;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.s{border-color:rgba(0,229,195,.4);color:#00e5a0}
#toast.e{border-color:rgba(255,92,92,.4);color:#ff5c5c}
.site-footer{border-top:1px solid var(--border);padding:2rem;text-align:center;color:var(--text3);font-size:.78rem;margin-top:2rem;}
.site-footer a{color:var(--text2);}
.site-footer a:hover{color:var(--mint)}
@media(max-width:900px){.nav-links{display:none}.nav-auth{display:none}.nav-hamburger{display:flex}}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr)}.form-row{flex-direction:column}}
</style>
</head>

<script>
const MOCK_CONTESTS=[
  {id:1,title:'2026 공공데이터 AI 활용 아이디어 공모전',org:'행정안전부',cat:'중앙부처',deadline:'2026-08-31',prize:'장관상·500만원',url:'#',desc:'공공데이터와 AI를 결합한 혁신 서비스 아이디어 발굴. 공공기관 소속 누구나 참여 가능.'},
  {id:2,title:'스마트시티 AI 솔루션 경진대회',org:'국토교통부',cat:'중앙부처',deadline:'2026-09-15',prize:'최우수·300만원',url:'#',desc:'도시 문제 해결을 위한 AI 솔루션 개발 및 시연.'},
  {id:3,title:'서울시 AI 혁신 서비스 공모전',org:'서울특별시',cat:'지자체',deadline:'2026-07-05',prize:'시장상·200만원',url:'#',desc:'서울시민 생활 편의 향상을 위한 AI 서비스 개발.'},
  {id:4,title:'공공기관 AI 업무혁신 사례 공모전',org:'NIA',cat:'공공기관',deadline:'2026-10-31',prize:'우수상·표창장',url:'#',desc:'AI 도입을 통한 업무혁신 우수 사례 발굴 및 공유.'},
  {id:5,title:'생성형 AI 앱 개발 해커톤',org:'카카오',cat:'민간',deadline:'2026-07-20',prize:'대상·1,000만원',url:'#',desc:'Claude·GPT API 활용 혁신 서비스 개발 경쟁. 48시간 해커톤.'},
  {id:6,title:'지역 AI 디지털 혁신 공모전',org:'경기도',cat:'지자체',deadline:'2026-08-10',prize:'도지사상·150만원',url:'#',desc:'경기도 소재 공공기관 AI 기반 지역사회 혁신 아이디어.'},
];

let contests=[], curFilter='all';

function ddayStatus(d){
  if(!d)return'ok';
  const diff=Math.ceil((new Date(d)-new Date())/86400000);
  if(diff<0)return'closed';
  if(diff<=7)return'urgent';
  if(diff<=30)return'soon';
  return'ok';
}
function ddayLabel(d){
  if(!d)return'';
  const diff=Math.ceil((new Date(d)-new Date())/86400000);
  if(diff<0)return'마감';
  if(diff===0)return'D-day';
  return`D-${diff}`;
}

function renderContests(list){
  const el=document.getElementById('contest-grid');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🏅</div>해당 조건의 공모전이 없습니다.</div>`;return;}
  el.innerHTML=list.map(c=>{
    const st=ddayStatus(c.deadline);
    return`<div class="contest-card">
      <div class="contest-card-top">
        <span class="cc-cat">${esc(c.cat||c.category||'기타')}</span>
        <span class="cc-dday d-${st}">${ddayLabel(c.deadline)}</span>
      </div>
      <div class="cc-title">${esc(c.title)}</div>
      <div class="cc-org">📌 ${esc(c.org||c.organizer||'')}</div>
      ${c.desc||c.description?`<div class="cc-desc">${esc(c.desc||c.description)}</div>`:''}
      <div class="cc-meta">
        <span class="cc-deadline ${st}">🗓 마감: ${c.deadline||'미정'}</span>
        ${c.prize?`<span class="cc-prize">🏆 ${esc(c.prize)}</span>`:''}
      </div>
      ${(c.url&&c.url!=='#')?`<a class="cc-link" href="${esc(c.url)}" target="_blank">자세히 보기 →</a>`:''}
    </div>`;
  }).join('');
  const now=new Date();
  document.getElementById('cc-total').textContent=contests.length;
  document.getElementById('cc-urgent').textContent=contests.filter(c=>c.deadline&&Math.ceil((new Date(c.deadline)-now)/86400000)<=7&&Math.ceil((new Date(c.deadline)-now)/86400000)>=0).length;
  document.getElementById('cc-open').textContent=contests.filter(c=>!c.deadline||new Date(c.deadline)>=now).length;
  document.getElementById('cc-closed').textContent=contests.filter(c=>c.deadline&&new Date(c.deadline)<now).length;
}

function filterContest(f,btn){
  curFilter=f;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const now=new Date();
  if(f==='all')renderContests(contests);
  else if(f==='open')renderContests(contests.filter(c=>!c.deadline||new Date(c.deadline)>=now));
  else renderContests(contests.filter(c=>(c.cat||c.category)===f));
}

async function load(){
  if(CFG.isMock){contests=MOCK_CONTESTS;renderContests(contests);return;}
  try{
    const d=await apiGet({action:'getContests'});
    contests=Array.isArray(d)&&d.length?d:MOCK_CONTESTS;
    renderContests(contests);
  }catch{contests=MOCK_CONTESTS;renderContests(contests);}
}

async function addContest(){
  const title=document.getElementById('co-title').value.trim();
  const org=document.getElementById('co-org').value.trim();
  if(!title||!org){toast('공모전명과 주최기관은 필수입니다.','e');return;}
  const c={id:Date.now(),title,org,cat:document.getElementById('co-cat').value,deadline:document.getElementById('co-deadline').value,prize:document.getElementById('co-prize').value.trim(),url:document.getElementById('co-url').value.trim(),desc:document.getElementById('co-desc').value.trim()};
  contests.unshift(c);
  filterContest(curFilter, document.querySelector('.filter-tab.active'));
  closeModal('add-modal');
  toast('공모전이 등록됐습니다!','s');
  if(!CFG.isMock)await apiPost({action:'addContest',...c}).catch(()=>{});
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'));});

function getSession(){try{return JSON.parse(sessionStorage.getItem('gai_user')||localStorage.getItem('gai_user')||'null');}catch{return null;}}
function renderNavAuth(){
  const user=getSession(), wrap=document.getElementById('nav-auth');
  if(!wrap||!user)return;
  const av=(user.name||'?').slice(0,2);
  wrap.innerHTML=`<div class="nav-user"><div class="av">${av}</div><span class="name">${esc(user.name)}</span><a href="mypage.html" class="mypage-btn">마이페이지</a><span class="logout" onclick="logout()">로그아웃</span></div>`;
  const mLogin=document.getElementById('m-login-link'), mReg=document.getElementById('m-register-link');
  if(mLogin){mLogin.textContent='👤 마이페이지';mLogin.href='mypage.html';}
  if(mReg)mReg.style.display='none';
}
function logout(){
  sessionStorage.removeItem('gai_user');localStorage.removeItem('gai_user');
  toast('로그아웃 됐습니다.','');
  setTimeout(()=>location.href='../index.html',800);
}
function toggleD(){
  const h=document.getElementById('hbg'),d=document.getElementById('mdr');
  h.classList.toggle('open');d.classList.toggle('open');
  document.body.style.overflow=d.classList.contains('open')?'hidden':'';
}
function closeD(){
  document.getElementById('hbg').classList.remove('open');
  document.getElementById('mdr').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('DOMContentLoaded',()=>{renderNavAuth();load();});
</script>
</body>
</html>
