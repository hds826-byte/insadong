<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>준비 중 — GenAI 동아리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Fraunces:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--bg2:#0e1520;--bg3:#141d2b;--mint:#00e5c3;--mint-dim:rgba(0,229,195,.12);--text:#e2e8f0;--text2:#94a3b8;--text3:#4a5568;--border:rgba(255,255,255,.07);--nav-h:62px;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--nav-h);display:flex;align-items:center;padding:0 clamp(1rem,4vw,2rem);gap:.75rem;background:rgba(8,12,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Fraunces',serif;font-style:italic;font-size:1.1rem;color:var(--mint);text-decoration:none;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding-top:var(--nav-h);}
.wrap{text-align:center;padding:3rem 1.5rem;max-width:480px;}
.icon{font-size:4rem;margin-bottom:1.5rem;opacity:.5;}
h1{font-family:'Fraunces',serif;font-size:2rem;margin-bottom:.75rem;color:var(--text);}
p{color:var(--text2);font-size:.9rem;margin-bottom:1.5rem;line-height:1.7;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:8px;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid rgba(0,229,195,.3);background:var(--mint-dim);color:var(--mint);text-decoration:none;}
.btn:hover{background:rgba(0,229,195,.2)}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="../index.html">✦ GenAI 동아리</a>
</nav>
<main>
  <div class="wrap">
    <div class="icon">🛠</div>
    <h1>준비 중입니다</h1>
    <p>이 페이지는 현재 개발 중입니다.<br>곧 더 나은 모습으로 찾아올게요!</p>
    <a href="../index.html" class="btn">← 홈으로 돌아가기</a>
  </div>
</main>
</body>
</html>
